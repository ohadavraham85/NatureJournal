<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4E5D2A">
  <meta name="description" content="יומן טבע — דיווח תצפיות טבע: יונקים, פרפרים, פרחים, זוחלים, חרקים ופטריות. עובד גם בלי קליטה.">
  <title>יומן טבע</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="app-font" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    // Applies Settings ← עיצוב before first paint (written by src/lib/theme.ts).
    try {
      var r = JSON.parse(localStorage.getItem('nj-appearance-resolved') || 'null');
      if (r) {
        var root = document.documentElement;
        for (var k in r.vars) root.style.setProperty(k, r.vars[k]);
        root.style.fontSize = r.size + '%';
        if (r.dark) root.setAttribute('data-dark', '');
        if (r.fontHref) document.getElementById('app-font').href = r.fontHref;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', r.themeColor);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <span class="logo" data-icon="logo" data-icon-size="30" aria-hidden="true"></span>
      <div class="topbar-title-text">
        <h1 id="topbar-title">יומן טבע</h1>
        <span class="topbar-sub"><span id="topbar-greeting" class="topbar-greeting"></span><span id="topbar-datetime"></span><span id="offline-pill" class="offline-pill" hidden>ללא קליטה</span><button type="button" id="sync-pill" class="sync-pill" hidden></button></span>
      </div>
    </div>
    <div class="topbar-actions">
      <button type="button" id="whats-new-btn" class="topbar-btn whats-new-btn" title="מה חדש" aria-label="מה חדש"></button>
      <button type="button" id="nav-action" class="topbar-btn" title="הגדרות" aria-label="הגדרות"></button>
    </div>
  </header>

  <main id="main">
    <section id="view-home" class="view" hidden></section>
    <section id="view-journal" class="view" hidden></section>
    <section id="view-form" class="view" hidden></section>
    <section id="view-detail" class="view view-flush" hidden></section>
    <section id="view-species" class="view" hidden></section>
    <section id="view-gallery" class="view" hidden></section>
    <section id="view-map" class="view view-map" hidden></section>
    <section id="view-settings" class="view" hidden></section>
  </main>

  <button type="button" id="fab" class="fab" title="דיווח חדש" aria-label="דיווח חדש" hidden><span data-icon="plus" data-icon-size="28"></span></button>

  <nav class="tabbar" aria-label="ניווט ראשי">
    <button type="button" data-view="journal" class="tab"><span data-icon="journal"></span><span>יומן</span></button>
    <button type="button" data-view="gallery" class="tab"><span data-icon="grid"></span><span>גלריה</span></button>
    <button type="button" data-view="home" class="tab"><span data-icon="home"></span><span>בית</span></button>
    <button type="button" data-view="map" class="tab"><span data-icon="map"></span><span>מפה</span></button>
    <button type="button" data-view="species" class="tab"><span data-icon="leaf"></span><span>מינים</span></button>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="update-banner" class="update-banner" hidden>
    <span data-icon="refresh" data-icon-size="18"></span>
    <span id="update-banner-text">גרסה חדשה זמינה</span>
    <button type="button" id="update-banner-btn">עדכון</button>
  </div>
  <div id="modal-root"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
